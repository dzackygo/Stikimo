name: stikimo
description: Pembuat stiker Android dengan pemrosesan gambar lokal tanpa AI/ML.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.13.4 <4.0.0'
  flutter: '>=3.47.5'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  image: 4.10.1
  image_picker: 1.2.4
  path_provider: 2.1.6
  sqflite: 2.4.4+1
  uuid: 4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
